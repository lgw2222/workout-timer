name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Put the latest timer page inside the app
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html

      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --no-daemon -Pvc=${{ github.run_number }}

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk IntervalTimer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: IntervalTimer-apk
          path: IntervalTimer.apk

      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Interval Timer 1.${{ github.run_number }}
          files: IntervalTimer.apk
          make_latest: true
